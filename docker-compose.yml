version: '3'
services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/utilitydb
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      AGENT_COMMISSION_RATE: ${AGENT_COMMISSION_RATE:-0.03}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-usd}
    depends_on:
      - mongodb

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000/api
      REACT_APP_STRIPE_PUBLISHABLE_KEY: ${REACT_APP_STRIPE_PUBLISHABLE_KEY}

  mongodb:
    image: mongo:4.2
    ports:
      - "27017:27017"
